<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid · --space-1 → --space-16" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-0); font-family: var(--font-body); color: var(--ink); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--azul); border-radius: var(--radius-xs); width: 100%; }
  .box { width: 28px; display: flex; flex-direction: column; align-items: center; }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:28px"></div><span class="t">1·4</span></div>
    <div class="item"><div class="bar" style="height:8px;width:28px"></div><span class="t">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px;width:28px"></div><span class="t">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px;width:28px"></div><span class="t">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px;width:28px"></div><span class="t">6·24</span></div>
    <div class="item"><div class="bar" style="height:32px;width:28px"></div><span class="t">8·32</span></div>
    <div class="item"><div class="bar" style="height:48px;width:28px"></div><span class="t">12·48</span></div>
    <div class="item"><div class="bar" style="height:64px;width:28px"></div><span class="t">16·64</span></div>
  </div>
</body>
</html>
