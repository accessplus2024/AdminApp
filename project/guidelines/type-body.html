<!-- @dsCard group="Type" viewport="700x210" name="Body — Poppins" subtitle="Light/Regular reading · Medium/SemiBold for UI labels" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-0); font-family: var(--font-body); color: var(--ink); }
  .w300 { font-weight: 300; font-size: 18px; }
  .lead { font-weight: 300; font-size: 14px; color: var(--neutral-700); margin-top: 8px; max-width: 560px; line-height: 1.55; }
  .labels { display: flex; gap: 18px; margin-top: 14px; align-items: baseline; }
  .labels span { font-size: 13px; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--muted-foreground); margin-top: 14px; }
</style>
</head>
<body>
  <div class="w300">Poppins Light — sub-títulos e textos corridos</div>
  <div class="lead">O Access+ conecta estudantes de baixa renda às oportunidades que mudam trajetórias: bolsas, intercâmbios e programas seletivos.</div>
  <div class="labels">
    <span style="font-weight:300">Light 300</span>
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">SemiBold 600</span>
    <span style="font-weight:700">Bold 700</span>
  </div>
  <div class="meta">--font-body · Poppins</div>
</body>
</html>
