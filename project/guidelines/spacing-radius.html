<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="Soft, pill-forward geometry — xs → pill" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-0); font-family: var(--font-body); color: var(--ink); }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--azul-soft); border: 1.5px solid var(--azul); }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="t">xs · 6</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="t">sm · 8</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="t">md · 10</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="t">lg · 14</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="t">xl · 20</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="t">2xl · 28</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="t">pill</span></div>
  </div>
</body>
</html>
