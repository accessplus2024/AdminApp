<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Cool indigo-tinted shadows · xs → xl (overlays only)" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 22px; background: var(--neutral-50); font-family: var(--font-body); color: var(--ink); }
  .row { display: flex; gap: 22px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 72px; background: var(--card); border-radius: var(--radius-lg); }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="t">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="t">sm · cards</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="t">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="t">lg · menus</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="t">xl · dialogs</span></div>
  </div>
</body>
</html>
