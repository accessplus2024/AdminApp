<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-50); }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
  .ico { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.AccessPlusDesignSystem_ece1f0;
  const { Alert, Dialog, Button } = NS;
  const Ic = (n) => <i data-lucide={n} className="ico"></i>;
  function Demo() {
    const [open, setOpen] = React.useState(false);
    React.useEffect(() => { window.lucide && lucide.createIcons(); });
    return (
      <div className="stack">
        <Alert variant="success" icon={Ic('circle-check')} title="Oportunidade publicada">Já está visível para os estudantes.</Alert>
        <Alert variant="info" icon={Ic('info')} title="Curadoria semanal">12 novas oportunidades aguardam revisão.</Alert>
        <Alert variant="warning" icon={Ic('triangle-alert')} title="Prazo encerra amanhã" />
        <Alert variant="danger" icon={Ic('octagon-alert')} title="Falha na importação">Confira o arquivo CSV e tente novamente.</Alert>
        <div><Button variant="primary" onClick={() => setOpen(true)}>Abrir diálogo</Button></div>
        <Dialog open={open} onClose={() => setOpen(false)}
          title="Excluir oportunidade?"
          description="Esta ação não pode ser desfeita."
          footer={<><Button variant="ghost" onClick={() => setOpen(false)}>Cancelar</Button><Button variant="destructive" onClick={() => setOpen(false)}>Excluir</Button></>}>
          A “Bolsa Santander Universidades” será removida permanentemente.
        </Dialog>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
