<!-- @dsCard group="Components" viewport="700x460" name="Forms — Input · Select · Checkbox · Switch" subtitle="Field controls with brand focus ring" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-50); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; max-width: 640px; }
  .ico { width: 16px; height: 16px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.AccessPlusDesignSystem_ece1f0;
  const { Input, Textarea, Select, Checkbox, Switch, Field } = NS;
  function Demo() {
    React.useEffect(() => { window.lucide && lucide.createIcons(); });
    return (
      <div className="grid">
        <Field label="Buscar" htmlFor="s">
          <Input id="s" placeholder="Buscar oportunidades" icon={<i data-lucide="search" className="ico"></i>} />
        </Field>
        <Field label="Categoria" htmlFor="c">
          <Select id="c" defaultValue="grad">
            <option value="grad">Graduação</option>
            <option value="pos">Pós-graduação</option>
            <option value="int">Intercâmbio</option>
          </Select>
        </Field>
        <Field label="E-mail" htmlFor="e" error="Informe um e-mail válido.">
          <Input id="e" defaultValue="ana@" error />
        </Field>
        <Field label="Resumo" htmlFor="r" hint="Máx. 280 caracteres.">
          <Textarea id="r" rows={2} placeholder="Descreva a oportunidade…" />
        </Field>
        <div className="stack">
          <Checkbox label="Destacar na home" defaultChecked />
          <Checkbox label="Exige comprovação de renda" />
        </div>
        <div className="stack">
          <Switch label="Publicar imediatamente" defaultChecked />
          <Switch label="Aceitar inscrições" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
