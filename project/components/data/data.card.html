<!-- @dsCard group="Components" viewport="700x430" name="Data — Stat · Table" subtitle="KPI tiles & list table" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--neutral-50); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .ico { width: 17px; height: 17px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.AccessPlusDesignSystem_ece1f0;
  const { Stat, Table, Card, CardBody, Badge } = NS;
  const Ic = (n) => <i data-lucide={n} className="ico"></i>;
  const rows = [
    { id: 1, titulo: 'Bolsa Santander Universidades', categoria: 'Graduação', status: 'Publicada', prazo: '30/06' },
    { id: 2, titulo: 'Intercâmbio Ciência sem Fronteiras', categoria: 'Intercâmbio', status: 'Em revisão', prazo: '12/07' },
    { id: 3, titulo: 'Programa Jovem Aprendiz Itaú', categoria: 'Emprego', status: 'Publicada', prazo: '05/07' },
  ];
  const cols = [
    { key: 'titulo', header: 'Oportunidade' },
    { key: 'categoria', header: 'Categoria' },
    { key: 'status', header: 'Status' },
    { key: 'prazo', header: 'Prazo', align: 'right' },
  ];
  function Demo() {
    React.useEffect(() => { window.lucide && lucide.createIcons(); });
    return (
      <div>
        <div className="stats">
          <Card><CardBody><Stat label="Abertas" value="128" icon={Ic('briefcase')} delta="+12%" deltaDir="up" /></CardBody></Card>
          <Card><CardBody><Stat label="Estudantes" value="9.4k" icon={Ic('users')} delta="+5%" deltaDir="up" /></CardBody></Card>
          <Card><CardBody><Stat label="Encerrando" value="7" icon={Ic('clock')} delta="-2" deltaDir="down" /></CardBody></Card>
        </div>
        <Card flat>
          <Table columns={cols} data={rows} renderCell={(r, c) =>
            c.key === 'status'
              ? <Badge variant={r.status === 'Publicada' ? 'success' : 'warning'} dot>{r.status}</Badge>
              : (c.key === 'categoria'
                  ? <Badge variant={r.categoria === 'Intercâmbio' ? 'pink' : (r.categoria === 'Emprego' ? 'mint' : 'primary')}>{r.categoria}</Badge>
                  : r[c.key])
          } />
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
